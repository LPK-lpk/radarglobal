name: Atualizar índice de edições

on:
  push:
    paths:
      - "edicoes/**/edicao.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.mjs
      - name: Commit do índice
        run: |
          git config user.name "radarglobal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add edicoes/index.json
          git diff --cached --quiet || git commit -m "chore: atualiza índice de edições"
          git push
